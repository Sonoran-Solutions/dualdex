name: DualDex CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Only newer runs for the same PR supersede one another. Main pushes stay unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Native & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Classification and immutable coverage starting-head evidence.

      - name: Classify changes
        id: changes
        run: python3 tools/ci/classify_changes.py
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}

      - name: Test change classification
        run: python3 -m unittest discover -s tools/ci -p 'test_classify_changes.py' -v

      - name: Validate allowlisted documentation
        if: steps.changes.outputs.full == 'false'
        run: git diff --check "$CI_BASE" "$CI_HEAD" --
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        if: steps.changes.outputs.full != 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            gradle/wrapper/gradle-wrapper.properties
            gradle.properties

      - name: Setup Android SDK
        if: steps.changes.outputs.full != 'false'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Run canonical tests (self-contained)
        if: steps.changes.outputs.full != 'false'
        run: ./ci.sh test

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Resolve both immutable PR endpoints.

      - name: Classify changes
        id: changes
        run: python3 tools/ci/classify_changes.py
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}

      - name: Test change classification
        run: python3 -m unittest discover -s tools/ci -p 'test_classify_changes.py' -v

      - name: Validate allowlisted documentation
        if: steps.changes.outputs.full == 'false'
        run: git diff --check "$CI_BASE" "$CI_HEAD" --
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        if: steps.changes.outputs.full != 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            gradle/wrapper/gradle-wrapper.properties
            gradle.properties

      - name: Setup Android SDK
        if: steps.changes.outputs.full != 'false'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Run canonical build
        if: steps.changes.outputs.full != 'false'
        run: ./ci.sh build

  source-validation:
    name: H&S Source Validation
    runs-on: ubuntu-latest

    # Explicit, separate job: the canonical gate above is self-contained, and this
    # one performs the independent cross-check against the pinned upstream source.
    # It fails loudly when the pinned checkout is missing or at the wrong revision;
    # it never degrades to a silent skip. No ROM, save or emulator state is used.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Resolve both immutable PR endpoints.

      - name: Classify changes
        id: changes
        run: python3 tools/ci/classify_changes.py
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}

      - name: Test change classification
        run: python3 -m unittest discover -s tools/ci -p 'test_classify_changes.py' -v

      - name: Validate allowlisted documentation
        if: steps.changes.outputs.full == 'false'
        run: git diff --check "$CI_BASE" "$CI_HEAD" --
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        if: steps.changes.outputs.full != 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            gradle/wrapper/gradle-wrapper.properties
            gradle.properties

      - name: Setup Android SDK
        if: steps.changes.outputs.full != 'false'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # The data-pack verification step runs the ARM preprocessor against the
      # pinned upstream source, so the job needs arm-none-eabi-cpp on PATH plus
      # the target C-library headers it must resolve (newlib's <string.h>,
      # <stdlib.h>, ... included via include/global.h). gcc-arm-none-eabi alone
      # ships no target headers; without libnewlib-arm-none-eabi preprocessing
      # dies with `fatal error: string.h: No such file or directory`.
      # `ci.sh source-check` locates the toolchain fail-closed and refuses to
      # skip the check.
      - name: Install ARM preprocessor and newlib headers (data-pack verification)
        if: steps.changes.outputs.full != 'false'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi

      # Pinned public upstream at the exact Release-v2.0.5 commit, limited to
      # what validation needs: the map tables (data/maps, src/data/region_map),
      # the sources the data-pack generator preprocesses (all of include, plus
      # src/pokemon.c, src/move.c and their src/data includes), the upstream
      # tools that generate its build-time headers (tools/mapjson,
      # tools/jsonproc, tools/learnset_helpers -- run by ./ci.sh source-check),
      # and the full data/ tree the tutor-learnset generation scans for .inc
      # scripts (data/maps and data/layouts are read for the map headers).
      - name: Fetch pinned Heart & Soul 2.0.5 source
        if: steps.changes.outputs.full != 'false'
        uses: actions/checkout@v4
        with:
          repository: PokemonHnS-Development/pokehns-expansion
          ref: 1f42b74dff0e9fe942419845d040663dd829a973
          path: upstream-hns/pokehns-expansion
          fetch-depth: 1
          sparse-checkout: |
            data
            include
            src/data
            src/pokemon.c
            src/move.c
            tools/mapjson
            tools/jsonproc
            tools/learnset_helpers
          sparse-checkout-cone-mode: true

      - name: Run H&S source validation
        if: steps.changes.outputs.full != 'false'
        run: ./ci.sh source-check
        env:
          HNS_UPSTREAM_DIR: upstream-hns/pokehns-expansion
